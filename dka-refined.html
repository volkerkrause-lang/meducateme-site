<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maya — Clinical reasoning | MeducateMe</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b0b0a;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#0b0b0a}</style>
</head>
<body>
<iframe id="lesson" src="dka-base.html" title="MeducateMe DKA lesson"></iframe>
<script>
const frame=document.getElementById('lesson');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument,w=frame.contentWindow;
  d.title='Maya — Clinical reasoning | MeducateMe';
  const heroMicro=d.querySelector('.hero .micro');
  if(heroMicro) heroMicro.textContent='CASE 01 · CLINICAL REASONING';

  const stage1=d.getElementById('stage1');
  if(stage1){
    const c=stage1.querySelector('.commentator');
    if(c){
      c.dataset.speech="Okay, we have a 12-year-old girl here who presents with polydipsia and polyuria, with weight loss, abdominal pain and vomiting, and some abnormal breathing. Many of you will already know where this is going, but let's take this. Let's look at this logically, step by step, and then start explaining.";
      const tr=c.querySelector('.transcript'); if(tr) tr.textContent=c.dataset.speech;
      const small=c.querySelector('small'); if(small) small.textContent='Opening overview';
    }
  }

  const stage3=d.getElementById('stage3');
  if(stage3){
    const c=stage3.querySelector('.commentator');
    if(c){
      c.dataset.speech="Maya is not just breathing quickly. Her breaths are unusually deep. Her oxygen saturation is 99 percent, so primary hypoxaemic respiratory failure is not the obvious explanation. Deep rapid breathing can be a compensatory response to metabolic acidosis, because increasing ventilation lowers carbon dioxide. So now let us put the clues together without jumping ahead. We have several weeks of polyuria, polydipsia and marked weight loss, followed by abdominal pain and vomiting, and now deep breathing suggesting an acid base disturbance. At this point we have enough information to ask which diagnosis can unify the whole pattern.";
      const small=c.querySelector('small'); if(small) small.textContent='Put the clues together';
    }
    if(!d.getElementById('diagnosis-check')){
      const box=d.createElement('div');
      box.className='mcq'; box.id='diagnosis-check';
      box.innerHTML='<span class="qno">DIAGNOSTIC CHECKPOINT</span><h3>Which diagnosis best unifies Maya’s three-week history and the new deep breathing?</h3><div class="choices" data-answer="2"><button class="choice">A · Gastroenteritis with dehydration</button><button class="choice">B · Diabetes insipidus</button><button class="choice">C · Diabetic ketoacidosis</button><button class="choice">D · Primary respiratory infection</button></div><div class="feedback"><b>Yes — now the diagnosis has been earned.</b> Polyuria and polydipsia suggest major renal water loss; weight loss suggests both fluid loss and catabolism; abdominal symptoms can occur in ketoacidosis; and the deep breathing points towards respiratory compensation for metabolic acidosis. Now we can ask the more useful question: <b>why does insulin deficiency produce this entire picture?</b></div>';
      stage3.appendChild(box);
    }
  }

  const stage4=d.getElementById('stage4');
  if(stage4){
    const lead=stage4.querySelector('.lead');
    if(lead) lead.textContent='Now that the clinical pattern has led us to DKA, go back to normal physiology. What does insulin normally do — and what changes when that signal disappears?';
    const micro=stage4.querySelector('.micro');
    if(micro) micro.textContent='Diagnosis established · normal first';
  }

  d.querySelectorAll('.commentator').forEach(c=>{
    const tr=c.querySelector('.transcript');
    if(tr) tr.textContent=c.dataset.speech || '';
  });

  const hints={
    'THINK 01':'Focus on what can change body weight quickly over only three weeks, especially with very large urine volumes.',
    'THINK 02':'Compare the timeline: the polyuria and thirst started weeks before the vomiting.',
    'THINK 03':'Her oxygen saturation is normal. Ask what metabolic disturbance makes ventilation become deep and rapid.',
    'DIAGNOSTIC CHECKPOINT':'Look for one diagnosis that explains polyuria, polydipsia, weight loss, abdominal symptoms and metabolic-acidosis-type breathing together.',
    'THINK 04':'Think of insulin as a signal that usable energy is available and that stored fuel does not need to be broken down.',
    'THINK 05':'Think about what happens when filtered glucose remains inside the renal tubule.',
    'THINK 06':'Respiratory compensation for a metabolic acidosis must reduce the acidifying respiratory component.',
    'THINK 07':'A serum concentration is not the same as total-body content; consider urinary potassium losses and redistribution.',
    'THINK 08':'Ask what insulin is treating in DKA besides the blood glucose concentration.',
    'THINK 09':'New headache, drowsiness, falling heart rate and rising blood pressure are neurological red flags in paediatric DKA.',
    'THINK 10':'Start with the causal failure rather than a downstream symptom or laboratory result.',
    'THINK 11':'Abdominal pain and vomiting can be consequences of ketoacidosis itself.',
    'ONE LAST QUESTION':'Start with the missing insulin signal and ask what metabolic state follows.'
  };

  d.querySelectorAll('.choices').forEach(group=>{
    const fresh=group.cloneNode(true);
    group.replaceWith(fresh);
    const mcq=fresh.closest('.mcq');
    const feedback=mcq && mcq.querySelector('.feedback');
    const qno=mcq && mcq.querySelector('.qno') ? mcq.querySelector('.qno').textContent.trim() : '';
    let wrongBox=mcq ? mcq.querySelector('.wrong-feedback') : null;
    if(mcq && !wrongBox){
      wrongBox=d.createElement('div'); wrongBox.className='feedback wrong-feedback';
      if(feedback) mcq.insertBefore(wrongBox,feedback); else mcq.appendChild(wrongBox);
    }
    fresh.querySelectorAll('.choice').forEach((btn,i)=>btn.addEventListener('click',()=>{
      if(fresh.dataset.completed==='1') return;
      const ans=Number(fresh.dataset.answer);
      if(i===ans){
        fresh.dataset.completed='1';
        fresh.querySelectorAll('.choice').forEach((b,j)=>{if(j===ans)b.classList.add('correct');b.disabled=true;});
        if(wrongBox) wrongBox.classList.remove('show');
        if(feedback) feedback.classList.add('show');
      }else{
        btn.classList.add('wrong');
        if(feedback) feedback.classList.remove('show');
        if(wrongBox){wrongBox.innerHTML='<b>Not quite — try another answer.</b> '+(hints[qno]||'That option does not explain the whole physiological pattern.');wrongBox.classList.add('show');}
      }
    }));
  });

  const style=d.createElement('style');
  style.textContent='.choice.wrong{border-color:var(--red);background:#291714}.choice.correct{border-color:var(--green);background:#12251c}.choice:disabled{cursor:default}.wrong-feedback{border-left:3px solid var(--red);background:#291714}.feedback:not(.wrong-feedback){border-left:3px solid var(--green)}';
  d.head.appendChild(style);
});
</script>
</body>
</html>
