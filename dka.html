<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maya — Clinical reasoning | MeducateMe</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b0b0a;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#0b0b0a}</style>
</head>
<body>
<iframe id="lesson" src="dka-base.html" title="MeducateMe DKA lesson"></iframe>
<script>
const opening="Okay, we have a 12-year-old girl here who presents with polydipsia and polyuria, with weight loss, abdominal pain and vomiting, and some abnormal breathing. Many of you will already know where this is going, but let's take this. Let's look at this logically, step by step, and then start explaining.";
const frame=document.getElementById('lesson');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  const c=d.querySelector('#stage1 .commentator');
  if(c){
    c.dataset.speech=opening;
    const tr=c.querySelector('.transcript'); if(tr) tr.textContent=opening;
    const small=c.querySelector('small'); if(small) small.textContent='Opening overview';
  }
});
</script>
</body>
</html>
