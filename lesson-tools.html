<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lesson review — MeducateMe</title><link rel="stylesheet" href="site-v2.css?v=9"><style>body{background:#090a0c}.tools-shell{width:min(1120px,92vw);margin:auto;padding:38px 0 90px}.tools-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.tools-head a{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.tools-title{font-size:clamp(36px,6vw,70px);line-height:.92;letter-spacing:-.045em;margin:8px 0 14px;text-transform:uppercase}.tools-title em{font-style:normal;color:var(--gold)}.tools-sub{color:var(--muted);max-width:760px;line-height:1.6}.tools-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 30px}.tools-tabs a{border:1px solid var(--line);padding:11px 14px;border-radius:999px;color:var(--ink);font-weight:800}.tools-tabs a.active{border-color:var(--gold);color:var(--gold)}.tool-panel{display:none}.tool-panel.active{display:block}.flash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.flashcard{min-height:210px;border:1px solid var(--line);background:#0d0e11;padding:22px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:.2s ease}.flashcard:hover{border-color:#e9a51b66}.flashcard .q{font-size:19px;font-weight:850;line-height:1.3}.flashcard .a{display:none;color:var(--muted);line-height:1.55;margin-top:18px}.flashcard.open .a{display:block}.flashcard small{color:var(--gold);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.info-card{border:1px solid var(--line);background:linear-gradient(145deg,#0d0e11,#111317);padding:clamp(20px,4vw,40px)}.info-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:stretch}.info-node{border:1px solid var(--line);padding:18px;min-height:150px}.info-node b{display:block;color:var(--gold);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}.info-node p{margin:0;color:var(--muted);line-height:1.45;font-size:14px}.info-arrow{display:none}.info-summary{margin-top:20px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);line-height:1.6}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.resource{border:1px solid var(--line);padding:18px}.resource strong{display:block;color:var(--gold);margin-bottom:6px}.resource p{color:var(--muted);margin:0 0 12px;line-height:1.5}.resource a{font-weight:800}@media(max-width:760px){.flash-grid,.resources{grid-template-columns:1fr}.info-flow{grid-template-columns:1fr}.tools-shell{padding-top:24px}.tools-head{align-items:flex-start}.flashcard{min-height:160px}}</style></head><body><main class="tools-shell"><div class="tools-head"><a id="backLink" href="hub.html">← Back to lesson</a><a href="hub.html"><b>MEDUCATE</b>ME</a></div><span class="eyebrow">Lesson consolidation</span><h1 class="tools-title" id="lessonTitle"></h1><p class="tools-sub" id="lessonSub"></p><nav class="tools-tabs"><a href="#flashcards" data-tab="flashcards">◫ Flashcards</a><a href="#infographic" data-tab="infographic">⌁ Infographic</a><a href="#resources" data-tab="resources">↗ Resources</a></nav><section class="tool-panel" id="flashcards"><div class="flash-grid" id="flashGrid"></div></section><section class="tool-panel" id="infographic"><div class="info-card"><div class="info-flow" id="infoFlow"></div><div class="info-summary" id="infoSummary"></div></div></section><section class="tool-panel" id="resources"><div class="resources" id="resourceGrid"></div></section></main><script src="lesson-tools.js?v=1"></script></body></html>
