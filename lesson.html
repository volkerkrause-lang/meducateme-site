<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson — MeducateMe</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"><style>
:root{--ink:#0b0b0a;--gold:#e9a51b;--paper:#f0eee8;--muted:#a7a49d;--line:rgba(240,238,232,.18)}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:Lato,Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.top{height:72px;padding:0 5vw;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0b0af2;backdrop-filter:blur(14px);z-index:10}.mark{font-weight:300}.mark b{font-weight:900}.back{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.progress{display:flex;gap:5px;flex:1;justify-content:center}.dot{width:30px;height:4px;border:0;background:#2b2a26;padding:0}.dot.active,.dot.done{background:var(--gold)}main{width:min(1120px,92vw);margin:auto}.micro{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.intro{min-height:calc(100vh - 72px);display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}.intro h1,.stage h2{font-size:clamp(52px,8vw,105px);line-height:.87;text-transform:uppercase;margin:18px 0}.intro h1 span{font-weight:300;color:var(--muted)}.intro p,.stage p{color:var(--muted);font-size:19px;line-height:1.6}.visual{min-height:450px;border:1px solid var(--line);display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#e9a51b18,transparent 48%);padding:40px}.visual strong{font-size:clamp(32px,5vw,62px);text-transform:uppercase}.start,.next{border:1px solid var(--gold);background:var(--gold);color:var(--ink);padding:14px 18px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-top:22px}.stage{display:none;min-height:calc(100vh - 72px);padding:70px 0}.stage.active{display:block}.stagehead{display:grid;grid-template-columns:1fr .55fr;gap:40px;align-items:end}.stage h2{font-size:clamp(44px,6vw,78px)}.canvas{margin:45px 0;border:1px solid var(--line);min-height:310px;padding:28px;display:grid;align-items:center}.chain{display:flex;gap:8px;align-items:stretch;overflow:auto}.node{border:1px solid var(--line);padding:20px;min-width:150px;flex:1;opacity:.35}.node:first-child{border-color:var(--gold);opacity:1}.arrow{display:grid;place-items:center;color:var(--gold)}.prompt{border-left:2px solid var(--gold);padding:22px 26px;background:#e9a51b0a}.prompt strong{font-size:24px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.choice{border:1px solid var(--line);background:transparent;color:var(--paper);padding:13px 18px}.choice:hover{border-color:var(--gold)}.placeholder{font-size:12px;color:var(--muted);margin-top:12px}.footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:35px}.stage-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}@media(max-width:850px){.intro,.stagehead{grid-template-columns:1fr}.visual{min-height:300px}.progress{display:none}.chain{padding-bottom:10px}}
</style></head><body><header class="top"><a class="mark" href="index.html"><b>MEDUCATE</b>ME</a><a class="back" href="learn.html">← Knowledge library</a><div class="progress" id="progress"></div></header><main><section class="intro" id="intro"><div><span class="micro" id="kind"></span><h1 id="title"></h1><p id="hook"></p><button class="start" id="start">Start lesson →</button></div><div class="visual"><div><span class="micro">CORE MODEL</span><br><strong id="visual"></strong><p id="visualsub"></p></div></div></section><div id="stages"></div></main><script>
const lessons={
'acid-base':{kind:'PHYSIOLOGY · INTERACTIVE',title:'ACID–BASE<br><span>IS A BALANCE</span>',hook:'Build the bicarbonate–CO₂ system first, disturb one variable, predict compensation, then use the model at the bedside.',visual:'pH ⇄ CO₂ ⇄ HCO₃⁻',visualsub:'Buffers, lungs and kidneys are one connected control system.',stages:[['01 · NORMAL','Build the buffer system','Start with hydrogen ions, bicarbonate and carbon dioxide. Make the Henderson–Hasselbalch relationship visual rather than something to memorise.','H⁺','HCO₃⁻ buffer','CO₂','Lungs'],['02 · CHANGE ONE THING','Disturb the system','Change CO₂ or bicarbonate first. Ask the learner to predict the direction of pH before revealing it.','Primary change','pH direction','Immediate buffer','Compensation'],['03 · COMPENSATE','Who can respond?','Contrast fast respiratory compensation with slower renal handling of bicarbonate and hydrogen ions.','Chemoreceptors','Ventilation','Kidney','New steady state'],['04 · CLINICAL INTERRUPTION','Read the gas','Present a short blood gas and require: acid or alkali → respiratory or metabolic → compensation appropriate?','pH','PaCO₂','HCO₃⁻','Interpretation'],['05 · APPLY','Why does the patient look like this?','Connect acidosis and compensation to respiratory pattern, potassium shifts and clinical signs.','Acidaemia','Respiratory drive','Kussmaul breathing','Clinical signs'],['06 · RECONSTRUCT','Build acid–base from memory','Finish by rebuilding the whole control system and interpreting one final gas without prompts.','Buffer','Lung','Kidney','Bedside gas']]},
'oxygen':{kind:'PHYSIOLOGY · INTERACTIVE',title:'OXYGEN<br><span>HAS A JOURNEY</span>',hook:'Follow oxygen from atmosphere to alveolus, haemoglobin, circulation and finally the mitochondrion.',visual:'AIR → BLOOD → TISSUE',visualsub:'Oxygen delivery is more than an SpO₂.',stages:[['01 · NORMAL','Get oxygen into blood','Build ventilation, alveolar oxygen, diffusion and haemoglobin loading.','Ventilation','Alveolus','Diffusion','Hb binding'],['02 · CARRY IT','What determines oxygen content?','Separate saturation from haemoglobin concentration and show why a normal SpO₂ can coexist with low oxygen content.','SaO₂','Haemoglobin','CaO₂','O₂ content'],['03 · DELIVER IT','Add the circulation','Combine arterial oxygen content with cardiac output to construct oxygen delivery.','CaO₂','Cardiac output','DO₂','Tissue'],['04 · PREDICT','Change one variable','Ask what happens to delivery with anaemia, hypoxaemia or low cardiac output before revealing the answer.','Anaemia','Hypoxaemia','Low CO','DO₂ falls'],['05 · CLINICAL INTERRUPTION','The child with 100% saturation','Use severe anaemia with normal saturation to force distinction between saturation and content.','SpO₂ 100%','Hb low','Content low','Delivery low'],['06 · RECONSTRUCT','From air to mitochondria','Rebuild the entire oxygen pathway and identify where common diseases interrupt it.','Air','Lung','Blood','Heart','Tissue']]},
'asthma':{kind:'DISEASE · INTERACTIVE',title:'ASTHMA<br><span>NARROWS THE AIRWAY</span>',hook:'Start with normal airway resistance, narrow the radius, predict the consequences and then make every treatment repair a mechanism.',visual:'RADIUS ↓ → RESISTANCE ↑',visualsub:'A small change in airway radius has a large effect on flow.',stages:[['01 · NORMAL','How air normally moves','Build pressure gradient, airway radius and flow before adding disease.','Pressure','Airway radius','Flow','Alveolus'],['02 · DISRUPTION','Narrow the airway','Add smooth-muscle contraction, mucosal oedema and mucus.','Bronchospasm','Oedema','Mucus','Radius ↓'],['03 · PREDICT','What happens to flow?','Make the learner predict resistance, expiratory flow and work of breathing before revealing them.','Resistance ↑','Flow ↓','Air trapping','Work ↑'],['04 · CLINICAL INTERRUPTION','Why the wheeze?','Connect turbulent/limited airflow, prolonged expiration and accessory muscle use to the mechanics.','Wheeze','Expiration','Retractions','Fatigue'],['05 · TREAT','Reverse the mechanism','Map β₂ agonist, steroids, oxygen and escalation to the specific physiological problem each addresses.','Bronchodilate','Reduce inflammation','Oxygenate','Support'],['06 · RECONSTRUCT','Explain an asthma attack','Rebuild trigger → airway change → mechanics → signs → treatment as one causal chain.','Trigger','Narrowing','Resistance','Symptoms','Treatment']]},
'bronchiolitis':{kind:'DISEASE · INTERACTIVE',title:'BRONCHIOLITIS<br><span>BLOCKS SMALL AIRWAYS</span>',hook:'Shrink the airway, add oedema and debris, then follow the consequences through air trapping, atelectasis and gas exchange.',visual:'SMALL AIRWAY + OEDEMA',visualsub:'In infants, a little swelling occupies a lot of airway.',stages:[['01 · NORMAL','Why infant airways matter','Compare small infant airway calibre with the effect of even modest mucosal swelling.','Small radius','Low reserve','Normal flow','Gas exchange'],['02 · DISRUPTION','Inflame the bronchiole','Add viral epithelial injury, oedema, mucus and cellular debris.','Virus','Oedema','Mucus','Obstruction'],['03 · PREDICT','Partial or complete blockage?','Contrast ball-valve air trapping with complete obstruction and distal atelectasis.','Partial block','Air trapping','Complete block','Atelectasis'],['04 · CLINICAL INTERRUPTION','Why crackles and recession?','Derive tachypnoea, recession, crackles, wheeze and feeding difficulty from mechanics and gas exchange.','Work ↑','Tachypnoea','Feeding ↓','Hypoxaemia'],['05 · TREAT','Support while it resolves','Explain why treatment is predominantly supportive and map oxygen/fluids/respiratory support to physiology.','Oxygen','Hydration','Suction selected','Respiratory support'],['06 · RECONSTRUCT','From virus to respiratory distress','Rebuild the causal pathway and distinguish it mechanistically from asthma.','Virus','Bronchiole','Obstruction','Gas exchange','Support']]},
'sepsis':{kind:'DISEASE · INTERACTIVE',title:'SEPSIS<br><span>BREAKS PERFUSION</span>',hook:'Start with controlled host defence, then let dysregulated inflammation alter vascular tone, permeability and tissue oxygen delivery.',visual:'INFECTION → PERFUSION',visualsub:'The dangerous problem is the host response and failing organ perfusion.',stages:[['01 · NORMAL','Defend without losing control','Build local immune recognition, inflammatory signalling and contained host response.','Pathogen','Recognition','Cytokines','Local defence'],['02 · DISRUPTION','The response becomes systemic','Expand vasodilation, endothelial activation and capillary leak.','Inflammation','Vasodilation','Leak','Effective volume ↓'],['03 · PREDICT','What happens to circulation?','Ask the learner to predict preload, vascular resistance, cardiac compensation and tissue delivery.','Preload ↓','SVR changes','HR ↑','Perfusion ↓'],['04 · CLINICAL INTERRUPTION','Warm child, dangerous shock','Use a child with warm peripheries and tachycardia to challenge the idea that shock must mean cold skin.','Warm','Tachycardia','Wide pulse pressure','Shock'],['05 · TREAT','Repair perfusion and source','Map antimicrobials, fluid, vasoactive support and source control to the causal model.','Antibiotics','Fluid','Vasoactive support','Source control'],['06 · RECONSTRUCT','From infection to organ dysfunction','Rebuild infection → dysregulated response → circulatory change → impaired delivery → organ dysfunction.','Infection','Host response','Circulation','Perfusion','Organ dysfunction']]}}
const key=new URLSearchParams(location.search).get('topic')||'acid-base',L=lessons[key]||lessons['acid-base'];document.title=L.title.replace(/<[^>]+>/g,' ')+' — MeducateMe';kind.textContent=L.kind;title.innerHTML=L.title;hook.textContent=L.hook;visual.textContent=L.visual;visualsub.textContent=L.visualsub;const stagesEl=document.querySelector('#stages'),prog=document.querySelector('#progress');L.stages.forEach((s,i)=>{prog.insertAdjacentHTML('beforeend',`<button class="dot" data-jump="${i}" aria-label="Stage ${i+1}"></button>`);stagesEl.insertAdjacentHTML('beforeend',`<section class="stage" data-stage="${i}"><div class="stagehead"><div><span class="micro">${s[0]}</span><h2>${s[1]}</h2></div><p>${s[2]}</p></div><div class="canvas"><div class="chain">${s.slice(3).map((n,j)=>`${j?'<span class="arrow">→</span>':''}<div class="node"><strong>${n}</strong><div class="placeholder">Interactive visual / timed narration cue</div></div>`).join('')}</div></div><div class="prompt"><span class="micro">ACTIVE LEARNING SLOT</span><br><strong>${i===2?'Predict before the mechanism is revealed.':i===3?'Clinical interruption: make a decision before continuing.':i===5?'Reconstruct the mechanism without prompts.':'Tap, listen and reveal the mechanism one step at a time.'}</strong><div class="choices"><button class="choice">Prediction / answer</button><button class="choice">Context flashcard</button><button class="choice">Audio cue</button></div></div><div class="footer-nav"><span class="stage-label">${i+1} / ${L.stages.length}</span>${i<L.stages.length-1?`<button class="next" data-next="${i+1}">Continue →</button>`:'<a class="next" href="learn.html">Finish → Knowledge library</a>'}</div></section>`)});let current=-1;function show(i){current=i;intro.style.display='none';document.querySelectorAll('.stage').forEach((x,j)=>x.classList.toggle('active',j===i));document.querySelectorAll('.dot').forEach((x,j)=>{x.classList.toggle('active',j===i);x.classList.toggle('done',j<i)});scrollTo({top:0,behavior:'smooth'})}start.onclick=()=>show(0);document.addEventListener('click',e=>{if(e.target.dataset.next)show(+e.target.dataset.next);if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)});
</script></body></html>
