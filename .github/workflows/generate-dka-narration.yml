name: Generate DKA Gemini narration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate 10 Gemini TTS recordings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-2.5-flash-preview-tts
          GEMINI_TTS_VOICE: Gacrux
        run: python tools/generate_dka_narration.py

      - name: Commit generated recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/dka/*.mp3
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Add Gemini TTS narration for DKA lesson"
            git push origin main
          fi
