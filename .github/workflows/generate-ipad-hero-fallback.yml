name: Generate iPad hero motion fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'meducateme-hero-bg.mp4'
      - '.github/workflows/generate-ipad-hero-fallback.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate animated WebP fallback
        run: |
          ffmpeg -y -i meducateme-hero-bg.mp4 \
            -vf "fps=6,scale=640:-2:flags=lanczos" \
            -loop 0 -c:v libwebp -lossless 0 -q:v 45 -preset picture -an \
            meducateme-hero-bg-ipad.webp

      - name: Commit generated fallback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meducateme-hero-bg-ipad.webp
          if git diff --cached --quiet; then
            echo 'No fallback changes to commit'
          else
            git commit -m 'Generate iPad hero motion fallback'
            git push origin HEAD:main
          fi
