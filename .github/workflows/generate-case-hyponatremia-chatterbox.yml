name: Generate case hyponatremia Chatterbox narration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'narration/references/voice-reference.wav'
      - 'tools/generate_case_hyponatremia_chatterbox.py'
      - 'narration/case-hyponatremia.json'
      - '.github/workflows/generate-case-hyponatremia-chatterbox.yml'

permissions:
  contents: write

concurrency:
  group: case-hyponatremia-chatterbox
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage:
          - 01-case
          - 02-concentration
          - 03-aldosterone
          - 04-adh
          - 05-sodium-loss
          - 06-water-gain
          - 07-siadh
          - 08-osmolality
          - 09-uosm
          - 10-volume
          - 11-urine-sodium
          - 12-siadh-csw
          - 13-brain
          - 14-acute-chronic
          - 15-emergency
          - 16-treatment
          - 17-reasoning
          - 18-back-to-case
          - 19-final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Chatterbox
        run: pip install chatterbox-tts
      - name: Generate narration section
        env:
          CHATTERBOX_STAGE: ${{ matrix.stage }}
          CHATTERBOX_EXAGGERATION: '0.65'
          CHATTERBOX_CFG_WEIGHT: '0.35'
          CHATTERBOX_MAX_CHARS: '280'
          CHATTERBOX_PAUSE_MS: '180'
        run: python tools/generate_case_hyponatremia_chatterbox.py
      - name: Verify generated section
        run: test -s "audio/case-hyponatremia-chatterbox/${{ matrix.stage }}.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: case-hyponatremia-${{ matrix.stage }}
          path: audio/case-hyponatremia-chatterbox/${{ matrix.stage }}.mp3
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update checkout to latest main
        run: git pull --rebase origin main
      - uses: actions/download-artifact@v4
        with:
          pattern: case-hyponatremia-*
          path: audio/case-hyponatremia-chatterbox
          merge-multiple: true
      - name: Verify complete lesson
        run: |
          set -e
          for f in 01-case 02-concentration 03-aldosterone 04-adh 05-sodium-loss 06-water-gain 07-siadh 08-osmolality 09-uosm 10-volume 11-urine-sodium 12-siadh-csw 13-brain 14-acute-chronic 15-emergency 16-treatment 17-reasoning 18-back-to-case 19-final; do
            test -s "audio/case-hyponatremia-chatterbox/$f.mp3" || exit 1
          done
      - name: Commit complete case narration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/case-hyponatremia-chatterbox/*.mp3
          if git diff --cached --quiet; then
            echo 'No audio changes to commit'
          else
            git commit -m 'Generate complete Chatterbox hyponatremia case narration'
            git push origin HEAD:main
          fi
