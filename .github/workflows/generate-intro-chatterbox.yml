name: Generate landing intro Chatterbox narration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'narration/references/voice-reference.wav'
      - 'tools/generate_intro_chatterbox.py'
      - 'narration/intro.json'
      - '.github/workflows/generate-intro-chatterbox.yml'

permissions:
  contents: write

concurrency:
  group: intro-chatterbox
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage: [01-why, 02-connect, 03-cases, 04-fundamentals, 05-concepts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Chatterbox
        run: pip install chatterbox-tts
      - name: Generate stage
        env:
          CHATTERBOX_STAGE: ${{ matrix.stage }}
          CHATTERBOX_EXAGGERATION: '0.65'
          CHATTERBOX_CFG_WEIGHT: '0.35'
          CHATTERBOX_MAX_CHARS: '280'
          CHATTERBOX_PAUSE_MS: '180'
        run: python tools/generate_intro_chatterbox.py
      - name: Verify stage
        run: test -s "audio/intro-chatterbox/${{ matrix.stage }}.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: intro-${{ matrix.stage }}
          path: audio/intro-chatterbox/${{ matrix.stage }}.mp3
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update checkout
        run: git pull --rebase origin main
      - uses: actions/download-artifact@v4
        with:
          pattern: intro-*
          path: audio/intro-chatterbox
          merge-multiple: true
      - name: Verify complete intro
        run: |
          for f in 01-why 02-connect 03-cases 04-fundamentals 05-concepts; do
            test -s "audio/intro-chatterbox/$f.mp3" || exit 1
          done
      - name: Publish narration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/intro-chatterbox/*.mp3
          if git diff --cached --quiet; then
            echo 'No audio changes to commit'
          else
            git commit -m 'Generate MeducateMe landing intro narration'
            git push origin HEAD:main
          fi
