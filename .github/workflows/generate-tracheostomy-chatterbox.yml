name: Generate tracheostomy draft Chatterbox narration

on:
  workflow_dispatch:
  push:
    branches: [draft-tracheostomy-clinical-concept]
    paths:
      - 'narration/references/voice-reference.wav'
      - 'tools/generate_tracheostomy_chatterbox.py'
      - 'narration/tracheostomy-draft.json'
      - '.github/workflows/generate-tracheostomy-chatterbox.yml'

permissions:
  contents: write

concurrency:
  group: tracheostomy-draft-chatterbox
  cancel-in-progress: true

jobs:
  generate:
    name: Generate ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage: [01-anatomy, 02-fresh-tract, 03-prevention, 04-red-flags, 05-emergency, 06-failed-replacement, 07-emphysema, 08-tubes, 09-challenge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Chatterbox
        run: pip install chatterbox-tts
      - name: Generate narration section
        env:
          CHATTERBOX_STAGE: ${{ matrix.stage }}
          CHATTERBOX_EXAGGERATION: '0.55'
          CHATTERBOX_CFG_WEIGHT: '0.35'
          CHATTERBOX_MAX_CHARS: '280'
          CHATTERBOX_PAUSE_MS: '180'
        run: python tools/generate_tracheostomy_chatterbox.py
      - name: Verify generated section
        run: test -s "audio/tracheostomy-chatterbox/${{ matrix.stage }}.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: tracheostomy-${{ matrix.stage }}
          path: audio/tracheostomy-chatterbox/${{ matrix.stage }}.mp3
          if-no-files-found: error
          retention-days: 1

  publish-to-draft-branch:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft-tracheostomy-clinical-concept
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tracheostomy-*
          path: audio/tracheostomy-chatterbox
          merge-multiple: true
      - name: Verify complete draft narration
        run: |
          set -e
          for f in 01-anatomy 02-fresh-tract 03-prevention 04-red-flags 05-emergency 06-failed-replacement 07-emphysema 08-tubes 09-challenge; do
            test -s "audio/tracheostomy-chatterbox/$f.mp3" || exit 1
          done
      - name: Commit narration to draft branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/tracheostomy-chatterbox/*.mp3
          if git diff --cached --quiet; then
            echo 'No audio changes to commit'
          else
            git commit -m 'Generate tracheostomy draft Chatterbox narration'
            git push origin HEAD:draft-tracheostomy-clinical-concept
          fi
