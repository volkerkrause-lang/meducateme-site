name: Validate modular lessons

on:
  push:
    branches: [main]
    paths:
      - 'lessons/**'
      - 'lesson-template/**'
      - 'lesson-player.*'
      - 'fundamental-*.html'
      - 'concept-*.html'
      - 'case-*.html'
      - 'tools/create_modular_lesson.py'
      - 'tools/validate_modular_lessons.py'
      - 'tools/validate_lesson_architecture.py'
      - '.github/workflows/validate-modular-lessons.yml'
  pull_request:
    paths:
      - 'lessons/**'
      - 'lesson-template/**'
      - 'lesson-player.*'
      - 'fundamental-*.html'
      - 'concept-*.html'
      - 'case-*.html'
      - 'tools/create_modular_lesson.py'
      - 'tools/validate_modular_lessons.py'
      - 'tools/validate_lesson_architecture.py'
      - '.github/workflows/validate-modular-lessons.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate modular lesson manifests
        run: python tools/validate_modular_lessons.py
      - name: Enforce future lesson architecture
        run: python tools/validate_lesson_architecture.py
