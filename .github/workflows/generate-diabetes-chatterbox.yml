name: Generate diabetes Chatterbox narration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'narration/diabetes.json'
      - 'tools/generate_diabetes_chatterbox.py'
      - 'narration/references/voice-reference.wav'
      - '.github/workflows/generate-diabetes-chatterbox.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install chatterbox-tts
      - name: Generate timed insulin-film narration
        env:
          CHATTERBOX_STAGE: 01-insulin-film
        run: python tools/generate_diabetes_chatterbox.py
      - name: Commit narration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/diabetes-chatterbox/*.mp3
          if git diff --cached --quiet; then
            echo 'No audio changes to commit'
          else
            git commit -m 'Generate diabetes Chatterbox narration'
            git push origin HEAD:main
          fi
