name: Rewrite DKA lesson v2

on:
  push:
    paths:
      - '.github/workflows/rewrite-dka-lesson-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite visible DKA lesson
        run: python tools/rewrite_dka_lesson_v2.py
      - name: Commit lesson rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No lesson changes to commit."
          else
            git commit -m "Rewrite DKA lesson around mechanism-first reasoning"
            git push origin main
          fi
